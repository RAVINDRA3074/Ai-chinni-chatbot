
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050914">
<title>Chinni AI 2.0</title>

<style>
:root {
  --cyan: #80eaff;
  --blue: #319fff;
  --glass: rgba(5,20,42,.62);
  --border: rgba(105,217,255,.3);
}
* { box-sizing:border-box; margin:0; padding:0; }

body {
  min-height:100vh;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:white;
  background:radial-gradient(ellipse at 45% 40%,#123b68,#071326 55%,#020611);
}

#stars {
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:0;
}

.screen {
  position:fixed;
  inset:0;
  display:none;
  overflow:hidden;
}
.screen.active { display:flex; }

.robot-background {
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:0;
  pointer-events:none;
}
.robot-background img {
  width:min(90vw,850px);
  height:95vh;
  object-fit:contain;
  opacity:.13;
  filter:blur(9px);
}

.robot-foreground {
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  z-index:1;
}
.robot-foreground img {
  width:min(72vw,760px);
  height:90vh;
  object-fit:contain;
  filter:drop-shadow(0 0 35px rgba(65,190,255,.45));
  animation:robotFloat 5s ease-in-out infinite, robotGlow 4s ease-in-out infinite;
}

@keyframes robotFloat {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-12px); }
}
@keyframes robotGlow {
  0%,100% { filter:drop-shadow(0 0 22px rgba(65,190,255,.25)); }
  50% { filter:drop-shadow(0 0 48px rgba(65,190,255,.65)); }
}

/* INTRO */

#intro {
  align-items:center;
  justify-content:center;
}

.intro-content {
  position:relative;
  z-index:4;
  width:min(90%,420px);
  margin:auto 5% 5% auto;
  padding:30px;
  text-align:center;
  border:1px solid var(--border);
  border-radius:26px;
  background:rgba(3,14,31,.78);
  backdrop-filter:blur(18px);
  box-shadow:0 0 55px rgba(35,160,255,.2);
  animation:appear .8s ease both;
}

.logo {
  color:var(--cyan);
  letter-spacing:5px;
  font-size:12px;
  margin-bottom:15px;
}
.intro-content h1 {
  font-size:clamp(38px,6vw,58px);
  margin-bottom:12px;
  background:linear-gradient(90deg,#fff,#65dfff,#a99aff);
  background-clip:text;
  -webkit-background-clip:text;
  color:transparent;
}
.intro-content p {
  color:#c0d9ee;
  line-height:1.8;
  font-size:14px;
}
.start-btn {
  margin-top:25px;
  padding:15px 34px;
  border:0;
  border-radius:30px;
  color:#031323;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  background:linear-gradient(120deg,#65dfff,#b2f7ff);
  box-shadow:0 0 25px rgba(89,220,255,.4);
  transition:.25s;
}
.start-btn:hover {
  transform:scale(1.06);
  box-shadow:0 0 40px rgba(89,220,255,.7);
}

/* CHAT SCREEN */

#chatScreen {
  flex-direction:column;
  isolation:isolate;
}
#chatScreen .robot-background { z-index:0; }
#chatScreen .robot-foreground {
  z-index:1;
  justify-content:flex-start;
  padding-left:2vw;
}

.chat-top {
  position:relative;
  z-index:5;
  flex:0 0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:17px 25px;
  background:linear-gradient(180deg,rgba(2,10,24,.8),rgba(2,10,24,.2));
  border-bottom:1px solid rgba(105,217,255,.16);
  backdrop-filter:blur(10px);
}
.chat-brand {
  color:var(--cyan);
  font-size:22px;
  font-weight:bold;
  letter-spacing:3px;
}
.status {
  color:#7dffc2;
  font-size:12px;
  margin-top:5px;
}
.voice-toggle {
  padding:10px 15px;
  border:1px solid var(--border);
  border-radius:25px;
  color:#d9f6ff;
  background:rgba(20,49,76,.8);
  cursor:pointer;
}

.chat-layout {
  position:relative;
  z-index:4;
  flex:1;
  min-height:0;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  padding:15px 4vw 20px 0;
}

.chat-panel {
  width:min(430px,38vw);
  height:min(77vh,760px);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:1px solid rgba(119,220,255,.38);
  border-radius:26px;
  background:rgba(4,16,34,.48);
  backdrop-filter:blur(15px) saturate(140%);
  box-shadow:0 18px 70px rgba(0,0,0,.3),0 0 45px rgba(36,151,255,.17);
}

.chat-heading {
  padding:17px;
  color:var(--cyan);
  font-size:15px;
  border-bottom:1px solid rgba(105,217,255,.18);
  background:rgba(7,26,49,.35);
}

.messages {
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:13px;
  scroll-behavior:smooth;
  scrollbar-width:thin;
  scrollbar-color:rgba(105,217,255,.4) transparent;
}

.message {
  display:flex;
  flex-direction:column;
  max-width:90%;
  gap:5px;
  animation:messageIn .35s ease both;
}
.message.user {
  align-self:flex-end;
  align-items:flex-end;
}
.message.bot {
  align-self:flex-start;
  align-items:flex-start;
}
.message-label {
  color:#80cfff;
  font-size:10px;
  letter-spacing:1px;
}
.message-bubble {
  padding:12px 15px;
  border-radius:17px;
  background:rgba(20,54,83,.82);
  border:1px solid rgba(105,217,255,.25);
  color:#e7f5ff;
  font-size:14px;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.message.user .message-bubble {
  background:linear-gradient(135deg,rgba(23,98,139,.96),rgba(52,77,145,.95));
  border-color:rgba(130,220,255,.4);
}

@keyframes messageIn {
  from { opacity:0; transform:translateY(12px); }
  to { opacity:1; transform:translateY(0); }
}

.typing {
  display:flex;
  align-items:center;
  gap:9px;
  width:fit-content;
  padding:10px 14px;
  border:1px solid var(--border);
  border-radius:15px;
  color:#9deaff;
  background:rgba(20,55,85,.65);
  font-size:12px;
}
.typing::after {
  content:"";
  width:24px;
  height:7px;
  background:radial-gradient(circle,#9af3ff 2px,transparent 3px) 0 50%/8px 7px repeat-x;
  animation:dots .8s steps(3) infinite;
}
@keyframes dots {
  to { background-position:24px 50%; }
}

.quick-prompts {
  display:flex;
  gap:7px;
  padding:10px;
  overflow-x:auto;
}
.quick-prompt {
  flex:0 0 auto;
  border:1px solid var(--border);
  border-radius:20px;
  padding:8px 12px;
  color:#bfeeff;
  background:rgba(23,56,83,.65);
  cursor:pointer;
  font-size:11px;
}

.composer {
  display:flex;
  align-items:center;
  gap:8px;
  padding:11px;
  border-top:1px solid rgba(105,217,255,.2);
  background:rgba(3,12,27,.48);
}
#messageInput {
  flex:1;
  min-width:0;
  height:45px;
  padding:0 14px;
  border:1px solid rgba(105,217,255,.25);
  border-radius:14px;
  outline:none;
  color:white;
  background:rgba(9,25,46,.88);
  font-size:14px;
}
#messageInput::placeholder { color:#7895b0; }
#messageInput:focus {
  border-color:#69d9ff;
  box-shadow:0 0 15px rgba(45,172,255,.2);
}
.action-btn {
  flex:0 0 auto;
  width:44px;
  height:44px;
  border:0;
  border-radius:13px;
  color:#04111f;
  background:linear-gradient(135deg,#69d9ff,#a0f3ff);
  cursor:pointer;
  font-size:18px;
  transition:.2s;
}
.action-btn:hover { transform:translateY(-2px); }
.action-btn:disabled { opacity:.5; cursor:not-allowed; }
.footer-note {
  padding:0 10px 9px;
  text-align:center;
  color:#7895b0;
  font-size:10px;
  background:rgba(3,12,27,.3);
}

.voice-toggle:hover,.quick-prompt:hover {
  box-shadow:0 0 15px rgba(89,220,255,.25);
}
.status { animation:pulse 2s infinite; }
@keyframes pulse {
  50% { opacity:.6; }
}

/* MOBILE DESIGN */

@media(max-width:760px) {
  .robot-foreground {
    justify-content:center !important;
    padding:0 !important;
    align-items:flex-start;
  }
  .robot-foreground img {
    width:100vw;
    height:62vh;
    object-position:center top;
  }
  .intro-content {
    width:90%;
    margin:auto 5% 5%;
    padding:22px;
  }
  .chat-top { padding:12px 14px; }
  .chat-brand { font-size:18px; }
  .chat-layout {
    align-items:flex-end;
    justify-content:center;
    padding:0 10px max(9px,env(safe-area-inset-bottom));
  }
  .chat-panel {
    width:100%;
    height:56vh;
    max-height:570px;
    border-radius:22px;
    background:rgba(4,16,34,.76);
    backdrop-filter:blur(16px);
  }
  .chat-heading { padding:11px 13px; }
  .messages { padding:11px; gap:9px; }
  .message { max-width:94%; }
  .message-bubble { font-size:13px; padding:10px 12px; }
  .quick-prompts { padding:7px 9px; }
  .composer { padding:8px; gap:6px; }
  .action-btn { width:40px; height:40px; }
  #messageInput { height:42px; }
}
@keyframes appear {
  from { opacity:0; transform:translateY(20px); }
  to { opacity:1; transform:translateY(0); }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration:.01ms !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>

<body>
<canvas id="stars"></canvas>

<section id="intro" class="screen active">
  <div class="robot-background">
    <img src="chinni-realistic-avatar.jpg" alt="Chinni background">
  </div>
  <div class="robot-foreground">
    <img src="chinni-realistic-avatar.jpg" alt="Chinni AI humanoid">
  </div>
  <div class="intro-content">
    <div class="logo">YOUR PERSONAL AI</div>
    <h1>CHINNI AI</h1>
    <p>
      Beyond Imagination.<br>
      Your intelligent AI companion is ready.<br>
      Talk, explore and create with Chinni.
    </p>
    <button class="start-btn" id="startBtn">✦ Start Chatting</button>
  </div>
</section>

<section id="chatScreen" class="screen">
  <div class="robot-background">
    <img src="chinni-realistic-avatar.jpg" alt="Chinni background">
  </div>
  <div class="robot-foreground">
    <img src="chinni-realistic-avatar.jpg" alt="Chinni humanoid avatar">
  </div>

  <header class="chat-top">
    <div>
      <div class="chat-brand">CHINNI AI</div>
      <div class="status">● Online · Gemini AI</div>
    </div>
    <button class="voice-toggle" id="voiceToggle">🔇 Voice OFF</button>
  </header>

  <main class="chat-layout">
    <div class="chat-panel">
      <div class="chat-heading">✨ Chat with Chinni</div>

      <div class="messages" id="messages">
        <div class="message bot">
          <span class="message-label">CHINNI</span>
          <div class="message-bubble">Hi! I'm Chinni. 😊 How can I help you today?</div>
        </div>
      </div>

      <div class="quick-prompts">
        <button class="quick-prompt" data-prompt="Hi Chinni!">👋 Say Hi</button>
        <button class="quick-prompt" data-prompt="Tell me a joke">😂 Tell a joke</button>
        <button class="quick-prompt" data-prompt="What can you do?">✨ Your abilities</button>
      </div>

      <div class="composer">
        <button class="action-btn" id="micBtn" title="Speak">🎙️</button>
        <input id="messageInput" type="text" placeholder="Message Chinni..." autocomplete="off">
        <button class="action-btn" id="sendBtn" title="Send">➤</button>
      </div>
      <div class="footer-note">Chinni AI 2.0 · Powered by Gemini</div>
    </div>
  </main>
</section>

<script>
const intro = document.getElementById("intro");
const chatScreen = document.getElementById("chatScreen");
const startBtn = document.getElementById("startBtn");
const messages = document.getElementById("messages");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");
const voiceToggle = document.getElementById("voiceToggle");

const BACKEND_URL =
  "https://chinni-ai-backend.ravindrakanna534.workers.dev/chat";

let isReplying = false;
let isListening = false;
let voiceEnabled = false;

function openChat() {
  intro.classList.remove("active");
  chatScreen.classList.add("active");
  messageInput.focus();
  scrollMessages();
}
startBtn.addEventListener("click", openChat);

function addMessage(text,sender) {
  const message = document.createElement("div");
  message.className = "message " + sender;

  const label = document.createElement("span");
  label.className = "message-label";
  label.textContent = sender === "user" ? "YOU" : "CHINNI";

  const bubble = document.createElement("div");
  bubble.className = "message-bubble";
  bubble.textContent = text;

  message.appendChild(label);
  message.appendChild(bubble);
  messages.appendChild(message);
  scrollMessages();
  return bubble;
}

function scrollMessages() {
  messages.scrollTop = messages.scrollHeight;
}

function showTyping() {
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.id = "typingIndicator";
  typing.textContent = "Chinni is thinking";
  messages.appendChild(typing);
  scrollMessages();
}

function hideTyping() {
  const typing = document.getElementById("typingIndicator");
  if (typing) typing.remove();
}

async function sendMessage(text) {
  text = text.trim();
  if (!text || isReplying) return;

  addMessage(text,"user");
  messageInput.value = "";
  isReplying = true;
  sendBtn.disabled = true;
  showTyping();

  try {
    const response = await fetch(BACKEND_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text})
    });

    if (!response.ok) throw new Error("Server error: " + response.status);

    const data = await response.json();
    if (!data.reply) throw new Error("Empty AI response");

    hideTyping();
    addMessage(data.reply,"bot");

    if (voiceEnabled) speakText(data.reply);

  } catch(error) {
    hideTyping();
    addMessage(
      "Sorry! AI connection lo problem vachindi. Please try again.",
      "bot"
    );
    console.error("Chinni error:",error);
  } finally {
    isReplying = false;
    sendBtn.disabled = false;
    messageInput.focus();
  }
}

sendBtn.addEventListener("click",() => sendMessage(messageInput.value));

messageInput.addEventListener("keydown",event => {
  if (event.key === "Enter") sendMessage(messageInput.value);
});

document.querySelectorAll(".quick-prompt").forEach(button => {
  button.addEventListener("click",() => sendMessage(button.dataset.prompt));
});

/* OPTIONAL VOICE OUTPUT */

voiceToggle.addEventListener("click",() => {
  voiceEnabled = !voiceEnabled;
  if (!voiceEnabled && "speechSynthesis" in window) speechSynthesis.cancel();
  voiceToggle.textContent = voiceEnabled ? "🔊 Voice ON" : "🔇 Voice OFF";
});

function speakText(text) {
  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();
  const speech = new SpeechSynthesisUtterance(text);
  const isTelugu = /[\u0C00-\u0C7F]/.test(text);

  speech.lang = isTelugu ? "te-IN" : "en-IN";
  speech.rate = .92;
  speech.pitch = 1.15;
  speech.volume = 1;

  const voices = speechSynthesis.getVoices();
  let selectedVoice = null;

  if (isTelugu) {
    selectedVoice = voices.find(v => v.lang.toLowerCase().startsWith("te"));
  }

  if (!selectedVoice) {
    selectedVoice = voices.find(v =>
      v.lang.toLowerCase().startsWith("en-in") &&
      /female|heera/i.test(v.name)
    );
  }

  if (!selectedVoice) {
    selectedVoice = voices.find(v => v.lang.toLowerCase().startsWith("en-in"));
  }

  if (selectedVoice) speech.voice = selectedVoice;
  speechSynthesis.speak(speech);
}

/* MICROPHONE INPUT */

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition = null;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = "te-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    isListening = true;
    micBtn.textContent = "🔴";
  };

  recognition.onend = () => {
    isListening = false;
    micBtn.textContent = "🎙️";
  };

  recognition.onresult = event => {
    const transcript = event.results[0][0].transcript;
    messageInput.value = transcript;
    sendMessage(transcript);
  };

  recognition.onerror = event => {
    console.error("Microphone error:",event.error);
    isListening = false;
    micBtn.textContent = "🎙️";
  };
}

micBtn.addEventListener("click",() => {
  if (!recognition) {
    addMessage("Your browser does not support voice recognition. Please use Chrome.","bot");
    return;
  }
  if (isListening) recognition.stop();
  else recognition.start();
});

/* STAR PARTICLES */

const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");
let stars = [];
let width = 0;
let height = 0;

function resizeCanvas() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  stars = [];

  const count = Math.min(130,Math.floor(width*height/9000));

  for (let i=0;i<count;i++) {
    stars.push({
      x:Math.random()*width,
      y:Math.random()*height,
      size:Math.random()*1.5+.3,
      speed:Math.random()*.35+.08,
      alpha:Math.random()*.7+.2
    });
  }
}

function animateStars() {
  ctx.clearRect(0,0,width,height);

  stars.forEach(star => {
    star.y -= star.speed;
    if (star.y < 0) {
      star.y = height;
      star.x = Math.random()*width;
    }
    ctx.beginPath();
    ctx.arc(star.x,star.y,star.size,0,Math.PI*2);
    ctx.fillStyle = `rgba(140,220,255,${star.alpha})`;
    ctx.fill();
  });

  requestAnimationFrame(animateStars);
}

window.addEventListener("resize",resizeCanvas);
resizeCanvas();
animateStars();

document.addEventListener("visibilitychange",() => {
  if (!document.hidden) scrollMessages();
});
</script>
</body>
</html>
