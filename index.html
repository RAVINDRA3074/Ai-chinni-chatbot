

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chinni AI</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background: radial-gradient(circle at top, #243b68, #101827 65%);
}
.screen {
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px;
}
.logo {
  width: 100px; height: 100px;
  display: grid; place-items: center;
  font-size: 55px; border-radius: 30px;
  background: #263d62;
  box-shadow: 0 0 45px #5688ff40;
  margin-bottom: 24px;
}
h1 { font-size: 36px; margin: 8px; }
p { color: #c1cce0; line-height: 1.6; text-align: center; }
button {
  border: 0; border-radius: 14px;
  padding: 15px 24px; font-size: 16px;
  font-weight: bold; cursor: pointer;
  background: #5688ff; color: white;
}
button:active { transform: scale(.98); }
#chatScreen { display: none; }
.chat {
  width: 100%; max-width: 440px;
  height: 75vh; min-height: 400px;
  background: #19243a;
  border: 1px solid #34435e;
  border-radius: 22px; padding: 18px;
  display: flex; flex-direction: column;
}
.header { font-size: 22px; font-weight: bold; }
#messages {
  flex: 1; overflow-y: auto;
  padding: 12px 0;
}
.msg {
  padding: 12px 14px; border-radius: 14px;
  margin: 10px 0; max-width: 90%;
  line-height: 1.5; overflow-wrap: anywhere;
}
.bot { background: #293952; }
.user { background: #426fe0; margin-left: auto; }
form { display: flex; gap: 8px; }
input {
  min-width: 0; flex: 1;
  padding: 13px; border-radius: 12px;
  border: 1px solid #465875;
  background: #101827; color: white;
  font-size: 16px;
}
.small { font-size: 13px; color: #9cacc5; }
</style>
</head>
<body>

<section class="screen" id="welcome">
  <div class="logo">🤖</div>
  <h1>Hey, welcome!</h1>
  <h2>I'm Chinni AI ✨</h2>
  <p>Your friendly AI companion.<br>
  Let's talk, learn and create together.</p>
  <button onclick="startChat()">💬 Start Chatting</button>
  <p class="small">Your little corner of conversation ❤️</p>
</section>

<section class="screen" id="chatScreen">
  <div class="chat">
    <div class="header">🤖 Chinni AI</div>
    <p class="small">Your friendly companion</p>
    <div id="messages">
      <div class="msg bot">Hi Arjun! 😊 I'm Chinni. What shall we talk about?</div>
    </div>
    <form id="chatForm">
      <input id="messageInput" placeholder="Message Chinni..." autocomplete="off" required>
      <button type="submit">Send</button>
    </form>
  </div>
</section>

<script>
function startChat() {
  document.getElementById("welcome").style.display = "none";
  document.getElementById("chatScreen").style.display = "flex";
  document.getElementById("messageInput").focus();
}

document.getElementById("chatForm").addEventListener("submit", function(e) {
  e.preventDefault();
  const input = document.getElementById("messageInput");
  const messages = document.getElementById("messages");
  const text = input.value.trim();
  if (!text) return;

  const userMsg = document.createElement("div");
  userMsg.className = "msg user";
  userMsg.textContent = text;
  messages.appendChild(userMsg);

  const reply = document.createElement("div");
  reply.className = "msg bot";
  reply.textContent = "I hear you 😊 I'm still learning! Soon I'll be connected to a real AI brain.";
  messages.appendChild(reply);

  input.value = "";
  messages.scrollTop = messages.scrollHeight;
});
</script>
</body>
</html>
